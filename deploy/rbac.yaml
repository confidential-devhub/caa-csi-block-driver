apiVersion: v1
kind: ServiceAccount
metadata:
  name: caa-csi-provisioner
  namespace: caa-csi-block
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caa-csi-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  # The provisioner reads both objects to resolve the snapshot handle for restore.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caa-csi-provisioner-binding
subjects:
  - kind: ServiceAccount
    name: caa-csi-provisioner
    namespace: caa-csi-block
roleRef:
  kind: ClusterRole
  name: caa-csi-provisioner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caa-csi-snapshotter-role
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caa-csi-snapshotter-binding
subjects:
  - kind: ServiceAccount
    name: caa-csi-provisioner
    namespace: caa-csi-block
roleRef:
  kind: ClusterRole
  name: caa-csi-snapshotter-role
  apiGroup: rbac.authorization.k8s.io
---
# OpenShift requires explicit SCC authorization for the privileged driver and
# node registrar containers that access kubelet and Kata host paths.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caa-csi-provisioner-privileged-scc
  namespace: caa-csi-block
subjects:
  - kind: ServiceAccount
    name: caa-csi-provisioner
    namespace: caa-csi-block
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
---
# The IBM Cloud provider reads the user-created ibm-cloud-credentials Secret
# from the driver's namespace. Other providers do not use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: caa-csi-provisioner-ibmcloud
  namespace: caa-csi-block
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ibm-cloud-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caa-csi-provisioner-ibmcloud
  namespace: caa-csi-block
subjects:
  - kind: ServiceAccount
    name: caa-csi-provisioner
    namespace: caa-csi-block
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: caa-csi-provisioner-ibmcloud
