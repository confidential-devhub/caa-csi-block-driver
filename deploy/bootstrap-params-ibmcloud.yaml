apiVersion: v1
kind: ConfigMap
metadata:
  name: caa-csi-bootstrap-params
  namespace: caa-csi-block
  labels:
    app: caa-csi-block
data:
  # Same keys as the IBM Cloud StorageClass — used for empty-store recovery / delete fallback.
  # Keep these in sync with deploy/storageclass-ibmcloud.yaml, including iops, throughput,
  # encrypted and encryptionKey if you set them there.
  bootstrap-params.json: |
    {
      "cloudProvider": "ibmcloud",
      "region": "us-south",
      "zone": "us-south-1",
      "profile": "general-purpose",
      "resourceGroup": "",
      "billingType": "hourly",
      "encrypted": "false"
    }
