apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caa-csi-block-plugin
  namespace: caa-csi-block
  labels:
    app: caa-csi-block
spec:
  selector:
    matchLabels:
      app: caa-csi-block
  template:
    metadata:
      labels:
        app: caa-csi-block
    spec:
      serviceAccountName: caa-csi-provisioner
      containers:
        # Sidecar: csi-provisioner (handles CreateVolume/DeleteVolume RPCs from Kubernetes)
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
          args:
            - "--v=3"
            - "--csi-address=/csi/csi.sock"
            - "--timeout=600s"
            - "--worker-threads=5"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /csi
              name: socket-dir

        # Sidecar: node-driver-registrar (registers CSI driver with kubelet)
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
          args:
            - "--v=3"
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/caa-csi-block/csi.sock"
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /registration
              name: registration-dir

        # Main: caa-csi-block-driver (compiled with the ibmcloud provider)
        - name: caa-csi-block-driver
          image: localhost/caa-csi-block-driver:v0.2.0
          args:
            - "--drivername=caa-csi-block.csi.confidentialcontainers.io"
            - "--endpoint=unix:///csi/csi.sock"
            - "--sidecarEndpoint=/provider/provider.sock"
            - "--nodeid=$(KUBE_NODE_NAME)"
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: IKS_ENABLED
              value: "True"
            - name: IKS_BLOCK_PROVIDER_NAME
              value: "iks-vpc-classic"
            - name: VPC_ENABLED
              value: "True"
            - name: VPC_BLOCK_PROVIDER_NAME
              value: "vpc-classic"
            # Path to storage-secret-store mount (required by secret-utils-lib / ibmcloud-volume-vpc SDK)
            - name: SECRET_CONFIG_PATH
              value: "/etc/storage_ibmc"
            # Empty-store recovery / delete fallback configuration
            - name: CSI_CLOUD_PROVIDER
              value: "ibmcloud"
            # Fallback to local host-side stats when kata-runtime is not present in container $PATH
            - name: CSI_ALLOW_HOST_STATS_FALLBACK
              value: "true"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /provider
              name: provider-socket-dir
            - mountPath: /var/lib/kubelet/pods
              name: mountpoint-dir
              mountPropagation: Bidirectional
            - mountPath: /var/lib/kubelet/plugins
              name: plugins-dir
              mountPropagation: Bidirectional
            - mountPath: /run/kata-containers/shared/direct-volumes
              name: shared-directvols
            - mountPath: /var/lib/caa-csi-block
              name: csi-data
            - mountPath: /etc/storage_ibmc
              name: customer-auth
              readOnly: true

        # Provides short-lived IBM credentials to the driver over provider.sock.
        - name: storage-secret-sidecar
          image: icr.io/obs/armada-storage-secret:v1.3.65
          args:
            - "--endpoint=unix:/sidecardir/provider.sock"
          env:
            - name: TOKEN_EXPIRY_DIFF
              value: "20m"
            - name: PROFILE_CAPACITY
              value: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 40m
              memory: 80Mi
          volumeMounts:
            - mountPath: /sidecardir
              name: provider-socket-dir
            - mountPath: /var/run/secrets/tokens
              name: vault-token
              readOnly: true

      volumes:
        - name: provider-socket-dir
          emptyDir: {}
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault-token
                  expirationSeconds: 600
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/caa-csi-block
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: plugins-dir
          hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
        - name: shared-directvols
          hostPath:
            path: /run/kata-containers/shared/direct-volumes/
            type: DirectoryOrCreate
        - name: csi-data
          hostPath:
            path: /var/lib/caa-csi-block
            type: DirectoryOrCreate
        - name: customer-auth
          secret:
            secretName: storage-secret-store
