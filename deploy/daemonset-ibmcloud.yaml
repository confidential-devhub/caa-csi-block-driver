apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caa-csi-block-plugin
  namespace: caa-csi-block
  labels:
    app: caa-csi-block
spec:
  selector:
    matchLabels:
      app: caa-csi-block
  template:
    metadata:
      labels:
        app: caa-csi-block
    spec:
      serviceAccountName: caa-csi-provisioner
      containers:
        # Sidecar: csi-provisioner (handles CreateVolume/DeleteVolume RPCs from Kubernetes)
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.2.0
          args:
            - "--v=3"
            - "--csi-address=/csi/csi.sock"
            - "--timeout=600s"
            - "--leader-election=true"
            - "--worker-threads=5"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
        # Sidecar: csi-snapshotter (handles CreateSnapshot/DeleteSnapshot RPCs).
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
          args:
            - "--v=3"
            - "--csi-address=/csi/csi.sock"
            - "--timeout=600s"
            - "--leader-election=true"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
        # Sidecar: node-driver-registrar (registers CSI driver with kubelet)
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
          args:
            - "--v=3"
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/data/kubelet/plugins/caa-csi-block/csi.sock"
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /registration
              name: registration-dir
        # Main: caa-csi-block-driver (compiled with the ibmcloud provider)
        - name: caa-csi-block-driver
          image: localhost/caa-csi-block-driver:v0.2.0
          args:
            - "--drivername=caa-csi-block.csi.confidentialcontainers.io"
            - "--endpoint=unix:///csi/csi.sock"
            - "--nodeid=$(KUBE_NODE_NAME)"
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Empty-store recovery / delete fallback (see deploy/bootstrap-params-ibmcloud.yaml).
            - name: CSI_CLOUD_PROVIDER
              value: "ibmcloud"
            - name: CSI_BOOTSTRAP_PARAMS_FILE
              value: /etc/caa-csi-block/bootstrap-params.json
            # Fallback to local host-side stats when kata-runtime is not present in container $PATH
            - name: CSI_ALLOW_HOST_STATS_FALLBACK
              value: "true"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            # Service account token used for IBM Cloud trusted profile authentication.
            - mountPath: /var/run/secrets/tokens
              name: vault-token
              readOnly: true
            - mountPath: /var/data/kubelet/pods
              name: mountpoint-dir
              mountPropagation: Bidirectional
            - mountPath: /var/data/kubelet/plugins
              name: plugins-dir
              mountPropagation: Bidirectional
            - mountPath: /run/kata-containers/shared/direct-volumes
              name: shared-directvols
            - mountPath: /var/lib/caa-csi-block
              name: csi-data
            - mountPath: /etc/caa-csi-block
              name: bootstrap-params
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault-token
                  expirationSeconds: 600
        - name: socket-dir
          hostPath:
            path: /var/data/kubelet/plugins/caa-csi-block
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: /var/data/kubelet/pods
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/data/kubelet/plugins_registry
            type: Directory
        - name: plugins-dir
          hostPath:
            path: /var/data/kubelet/plugins
            type: Directory
        - name: shared-directvols
          hostPath:
            path: /run/kata-containers/shared/direct-volumes/
            type: DirectoryOrCreate
        - name: csi-data
          hostPath:
            path: /var/lib/caa-csi-block
            type: DirectoryOrCreate
        - name: bootstrap-params
          configMap:
            name: caa-csi-bootstrap-params
            optional: true
