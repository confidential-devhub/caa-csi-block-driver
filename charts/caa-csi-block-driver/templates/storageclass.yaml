{{- if .Values.storageClass.create }}
{{- if and (eq .Values.provider "aws") (not .Values.aws.availabilityZone) (ne .Values.storageClass.volumeBindingMode "WaitForFirstConsumer") }}
{{- fail "When provider=aws and aws.availabilityZone is not set, storageClass.volumeBindingMode must be WaitForFirstConsumer (so the AZ is inferred from the scheduled node's topology)" }}
{{- end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "caa-csi.storageClassName" . }}
  labels:
    {{- include "caa-csi.labels" . | nindent 4 }}
provisioner: {{ .Values.csiDriver.name }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
parameters:
  cloudProvider: {{ .Values.provider }}
  {{- if eq .Values.provider "aws" }}
  awsRegion: {{ required "aws.region is required when provider=aws" .Values.aws.region | quote }}
  {{- if .Values.aws.availabilityZone }}
  awsAvailabilityZone: {{ .Values.aws.availabilityZone | quote }}
  {{- end }}
  awsVolumeType: {{ .Values.aws.volumeType | quote }}
  {{- end }}
  {{- if eq .Values.provider "azure" }}
  azureSubscriptionId: {{ required "azure.subscriptionId is required when provider=azure" .Values.azure.subscriptionId | quote }}
  azureResourceGroup: {{ required "azure.resourceGroup is required when provider=azure" .Values.azure.resourceGroup | quote }}
  azureLocation: {{ required "azure.location is required when provider=azure" .Values.azure.location | quote }}
  azureDiskSku: {{ .Values.azure.diskSku | quote }}
  {{- end }}
  {{- if eq .Values.provider "libvirt" }}
  cloudProviderVolumePath: {{ .Values.libvirt.volumeDir | quote }}
  {{- end }}
  {{- if .Values.cdh.enabled }}
  encrypt-type: {{ .Values.cdh.encryptionType | quote }}
  kbs-key-id: {{ required "cdh.key must be set when cdh.enabled=true" .Values.cdh.key | quote }}
  {{- end }}
{{- end }}
